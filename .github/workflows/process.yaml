name: Process
on:
  # 每日 03:05 / 11:05 UTC（GitHub Actions cron 按 UTC 解析，= 北京时间 11:05 / 19:05）
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-process
  cancel-in-progress: false

env:
  # TZ 仅影响容器内 date 命令和 Python time，不影响 cron 触发时间（cron 按 UTC 解析）
  TZ: Asia/Shanghai

  # network proxy aggregate config
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

  # network reachable
  REACHABLE: ${{ vars.REACHABLE }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include special protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wzdnzd/aggregator:latest

    steps:
      - name: Check
        run: |
          if [ -z "$SUBSCRIBE_CONF" ]; then
              echo "Error: environment 'SUBSCRIBE_CONF' cannot be empty"
              exit 1
          fi

          if [ -z "$PUSH_TOKEN" ]; then
              echo "Error: environment 'PUSH_TOKEN' cannot be empty"
              exit 1
          fi

      - name: Process
        run: /entrypoint.sh process --overwrite

      - name: Timestamp
        run: date
